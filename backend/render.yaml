services:
  - type: web
    name: meditwin-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: super-secret-meditwin-jwt-key
      - key: DATABASE_URL
        sync: false
